services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: soc_lite
      MYSQL_USER: soc
      MYSQL_PASSWORD: socpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - soc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ID: soc-lite-local
      APP_SECRET: local-demo-secret-not-for-production
      DATABASE_URL: mysql://soc:socpass@db:3306/soc_lite
    ports:
      - "3000:3000"
    init: true

volumes:
  soc_mysql_data:
